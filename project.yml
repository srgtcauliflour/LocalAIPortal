name: LocalAIPortal
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    minorVersion: 0.33.0
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    minorVersion: 3.32.3
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
  StableDiffusion:
    path: Packages/StableDiffusion
targets:
  LocalAIPortal:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: MLXSwift
        product: MLX
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftTransformers
        product: Tokenizers
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: StableDiffusion
        product: StableDiffusion
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LocalAIPortal
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: Saves the images you create to your photo library.
    entitlements:
      path: App/LocalAIPortal.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
schemes:
  LocalAIPortal:
    build:
      targets:
        LocalAIPortal: all
    archive:
      config: Release
